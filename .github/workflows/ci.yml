name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: customer_management.settings.test
      SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint with ruff
        run: ruff check apps customer_management conftest.py

      - name: Check formatting with black
        run: black --check apps customer_management conftest.py manage.py

      - name: Run tests
        run: pytest --cov=apps --cov-report=xml

      - name: Django system check (deployment)
        run: |
          export POSTGRES_DB=ci
          export POSTGRES_USER=ci
          export POSTGRES_PASSWORD=ci
          DJANGO_SETTINGS_MODULE=customer_management.settings.dev python manage.py check

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t django-customer-management:ci .
